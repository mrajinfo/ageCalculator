# Optional: a local MongoDB for development.
#   docker compose up -d
# Matches the default MONGODB_URI in server/.env.example.

services:
  mongo:
    image: mongo:8
    container_name: agecalculator-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agecalculator-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGODB_URI: mongodb://mongo:27017/nepali_age_calculator
      APP_TIME_ZONE: Asia/Kathmandu
      SERVE_CLIENT: "false"
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5050"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agecalculator-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
